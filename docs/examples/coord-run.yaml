# Run from the repository root so the docs.examples package is importable.
schema_version: 1
model:
  name: fourier
  target: docs.examples.coordbench_location_encoder.FourierLocationEncoder
  kwargs:
    num_frequencies: 8
datasets: [california_housing]
evaluation:
  methods: [linear]
  split_test_type: nested_cv
  nested_splits: [[random, random]]
  folds: 2
  inner_folds: 2
  knn_ks: [5]
  knn_device: cpu
runtime:
  device: cpu
  seed: 0
output:
  file: results/fourier_coordbench.csv
  resume: false
